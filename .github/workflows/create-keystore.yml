name: Create signing key (run once)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "::error::Add the KEYSTORE_PASSWORD secret first (at least 6 characters)."
            exit 1
          fi
          keytool -genkeypair -keystore release.keystore -alias loop \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Loop, O=Loop, C=BR"
          base64 -w0 release.keystore > KEYSTORE_BASE64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            KEYSTORE_BASE64.txt
            release.keystore
          retention-days: 1
