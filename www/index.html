<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#3346F0" />
  <title>Loop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <!-- Today tab -->
    <section id="view-today" class="view is-active" aria-label="Today">
      <header class="hero" id="hero"></header>
      <div id="lists"></div>
    </section>

    <!-- Stats tab -->
    <section id="view-stats" class="view" aria-label="Stats">
      <div id="stats"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <button class="tab is-active" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>
      <span>Today</span>
    </button>
    <button class="fab" id="fab" aria-label="Add a habit">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
      <span>Stats</span>
    </button>
  </nav>

  <!-- Add / edit sheet -->
  <div class="sheet-wrap" id="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <form class="sheet" id="task-form" autocomplete="off" novalidate>
      <div class="sheet-grip"></div>
      <h2 id="sheet-title">New habit</h2>

      <label class="field">
        <span class="field-label">Name</span>
        <input id="f-title" type="text" maxlength="60" placeholder="e.g. Workout, Drink water, Read" required />
      </label>

      <div class="field">
        <span class="field-label">Icon</span>
        <div class="emoji-row" id="f-emoji" role="radiogroup" aria-label="Icon"></div>
      </div>

      <div class="field">
        <span class="field-label">Repeats</span>
        <div class="seg" id="f-freq" role="radiogroup" aria-label="Repeats">
          <button type="button" data-v="daily">Daily</button>
          <button type="button" data-v="days">Some days</button>
          <button type="button" data-v="weekly">Weekly</button>
          <button type="button" data-v="once">Once</button>
        </div>
        <p class="hint" id="freq-hint"></p>
      </div>

      <div class="field" id="row-days">
        <span class="field-label">On these days</span>
        <div class="chips" id="f-days"></div>
      </div>

      <label class="field" id="row-date">
        <span class="field-label">Date</span>
        <input id="f-date" type="date" />
      </label>

      <div class="field">
        <div class="toggle-row">
          <span class="field-label">Reminder</span>
          <label class="switch">
            <input id="f-remind" type="checkbox" />
            <span class="switch-ui"></span>
          </label>
        </div>
        <div id="row-time" class="time-row">
          <input id="f-time" type="time" value="09:00" />
          <div id="row-remindday" class="remindday">
            <span class="hint">on</span>
            <select id="f-remindday"></select>
          </div>
        </div>
      </div>

      <div class="field">
        <span class="field-label">Effort</span>
        <div class="seg" id="f-diff" role="radiogroup" aria-label="Effort">
          <button type="button" data-v="1">Easy <b>+10</b></button>
          <button type="button" data-v="2">Medium <b>+20</b></button>
          <button type="button" data-v="3">Hard <b>+35</b></button>
        </div>
      </div>

      <div class="sheet-actions">
        <button type="button" class="btn ghost danger" id="btn-delete">Delete</button>
        <button type="submit" class="btn primary" id="btn-save">Save habit</button>
      </div>
    </form>
  </div>

  <!-- Backup sheet -->
  <div class="sheet-wrap" id="backup" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet">
      <div class="sheet-grip"></div>
      <h2>Backup</h2>
      <p class="hint">Copy this text somewhere safe. To restore, paste a backup here and tap Restore.</p>
      <textarea id="backup-text" rows="8" spellcheck="false"></textarea>
      <div class="sheet-actions">
        <button type="button" class="btn ghost" id="btn-copy">Copy</button>
        <button type="button" class="btn primary" id="btn-restore">Restore</button>
      </div>
    </div>
  </div>

  <!-- Level up -->
  <div class="levelup" id="levelup" hidden>
    <div class="levelup-card">
      <p class="levelup-kicker">Level up</p>
      <div class="levelup-num" id="levelup-num">2</div>
      <p class="levelup-rank" id="levelup-rank">Starter</p>
      <button class="btn primary" id="levelup-ok">Keep going</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <script src="app.js"></script>
</body>
</html>
